name: ci

on:
  push:
    branches: [main, research/mist-cove-phase11b-real-eeg-audit-v1, research/mist-cove-phase13-explanation-adequacy-v1, research/mist-cove-phase14-multichannel-st-transfer-v1, research/mist-cove-phase16-expert-event-benchmark-v1, research/mist-sleep-phase-m1-independent-hmc-transfer-v1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  structural-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            configs/ci_cpu_constraints_v1.txt
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch and full test dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c configs/ci_cpu_constraints_v1.txt -e ".[dev]"
          python -m pip check
      - name: Verify CPU-only dependency environment
        run: |
          python - <<'PY'
          from importlib import metadata
          import torch, mne, pyedflib
          assert torch.version.cuda is None, "CPU CI must use CPU PyTorch"
          assert not any(d.metadata['Name'].lower().startswith('nvidia-') for d in metadata.distributions())
          print('torch', torch.__version__, 'mne', mne.__version__, 'pyedflib', pyedflib.__version__)
          PY
      - run: python -m pytest tests -ra

  patched-loader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install patched CPU serialization runtime
        run: |
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" -e ".[dev]"
          python -m pip check
      - name: Generated-only security and research regression
        run: python -m pytest tests/mist_cove/test_phase11b*.py tests/test_phase11b_triad.py tests/mist_cove/test_phase13*.py tests/mist_cove/test_phase14.py tests/mist_sleep/test_external_m1.py -ra
