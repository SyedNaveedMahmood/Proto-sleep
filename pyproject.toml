[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-sleep"
version = "0.1.0"
description = "Prototype-guided masked autoencoding experiments for single-channel EEG sleep staging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10,<2",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
edf = ["mne>=1.10,<1.11", "pyEDFlib>=0.1.42,<0.2", "xlrd>=2,<3"]
# The full generated-EDF test suite imports the optional EDF readers too.
# Keep these out of the base model/runtime installation.
dev = [
  "pytest>=8,<9",
  "mne>=1.10,<1.11",
  "pyEDFlib>=0.1.42,<0.2",
  "xlrd>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
